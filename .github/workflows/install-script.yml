name: Deploy install scripts

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/install.sh'
      - 'scripts/loki-node-setup.sh'

permissions:
  contents: read

jobs:
  deploy-scripts:
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Configure AWS credentials ─────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      # ── 3. Upload changed scripts to S3 ───────────────────────────────────
      # Only runs when install.sh or loki-node-setup.sh changes in main.
      # Both files are always synced so S3 is never out of date.
      - name: Upload scripts to S3
        run: |
          aws s3 cp scripts/install.sh s3://${{ secrets.S3_BUCKET_NAME }}/neurader/releases/install.sh \
            --content-type "text/x-shellscript" \
            --content-disposition "attachment; filename=install.sh"
          echo "✓ install.sh uploaded"

          aws s3 cp scripts/loki-node-setup.sh s3://${{ secrets.S3_BUCKET_NAME }}/neurader/releases/loki-node-setup.sh \
            --content-type "text/x-shellscript" \
            --content-disposition "attachment; filename=loki-node-setup.sh"
          echo "✓ loki-node-setup.sh uploaded"

      # ── 4. Invalidate CloudFront cache ────────────────────────────────────
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/neurader/releases/install.sh" "/neurader/releases/loki-node-setup.sh"
          echo "✓ CloudFront cache invalidated"